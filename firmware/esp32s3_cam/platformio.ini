; Freenove FNK0085 ESP32-S3-WROOM-1 camera board (N8R8: 8 MB quad flash, 8 MB octal PSRAM).
; Serial frame-capture firmware, ESP-IDF via PlatformIO. Host side: tools/capture_frame.py.
;
;   python -m platformio run
;   python -m platformio run -t upload --upload-port COM5

[platformio]
src_dir = main

[env:fnk0085]
platform = platformio/espressif32@8.0.0
platform_packages =
    platformio/framework-espidf@4.50505.0
    platformio/toolchain-xtensa-esp-elf@14.2.0+20260121
framework = espidf
board = esp32-s3-devkitc-1
board_upload.flash_size = 8MB
board_build.partitions = partitions.csv

upload_speed = 921600
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
