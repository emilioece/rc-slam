; Single VL53L0X bring-up on the Nucleo F401RE (bring-up step 3).
; Wiring: VIN 3V3, GND GND, SDA D14, SCL D15, XSHUT D10, GPIO1 unconnected.
;
;   Build + flash:  pio run -t upload
;   Watch output:   pio device monitor

[env:nucleo_f401re]
platform = ststm32
board = nucleo_f401re
framework = arduino
upload_protocol = mbed
lib_deps = pololu/VL53L0X@^1.3.1

monitor_speed = 115200
