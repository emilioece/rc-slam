; Camera bring-up test for the Freenove ESP32-S3 WROOM CAM (N8R8: 8 MB flash, 8 MB octal PSRAM).
;
;   Build + flash:  pio run -t upload
;   Watch output:   pio device monitor
;   Grab a photo:   python capture.py

[env:freenove_esp32s3_cam]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags = -DBOARD_HAS_PSRAM

monitor_speed = 921600
monitor_filters = esp32_exception_decoder
upload_speed = 921600
